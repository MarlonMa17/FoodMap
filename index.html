<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开封美食地图</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink:        #1E120A;
      --ink-soft:   #6B5040;
      --ink-ghost:  #A08878;
      --parchment:  #FAF6EF;
      --cream:      #FFFDF9;
      --gold:       #B8860B;
      --gold-light: #E8C97A;
      --gold-pale:  #F7EDD0;
      --rule:       #E0D4C0;
      --header-bg:  #1E120A;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
      background: var(--parchment);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--header-bg);
      padding: 52px 24px 44px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before, header::after {
      content: '';
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      transform: translateX(-50%);
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(184,134,11,0.3), transparent);
    }

    .header-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
      color: var(--gold);
      font-size: 0.7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .header-ornament::before, .header-ornament::after {
      content: '';
      flex: 1;
      max-width: 80px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .header-ornament::after {
      background: linear-gradient(to left, transparent, var(--gold));
    }

    header h1 {
      font-family: 'Playfair Display', 'Noto Serif SC', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      color: #F5EDD8;
      letter-spacing: 6px;
      margin-bottom: 14px;
      line-height: 1.2;
    }

    .header-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 16px auto;
      color: var(--gold);
    }
    .header-divider span { font-size: 0.6rem; opacity: 0.7; letter-spacing: 2px; }
    .header-divider::before, .header-divider::after {
      content: '';
      width: 60px;
      height: 1px;
      background: var(--gold);
      opacity: 0.5;
    }

    header p {
      color: #B09070;
      font-size: 0.82rem;
      letter-spacing: 3px;
      font-style: italic;
    }

    /* ── CONTROLS ── */
    .controls {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--cream);
      border-bottom: 1px solid var(--rule);
      box-shadow: 0 2px 16px rgba(30,18,10,0.07);
    }

    .search-wrap {
      padding: 16px 24px 12px;
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-icon {
      position: absolute;
      left: 38px;
      color: var(--ink-ghost);
      pointer-events: none;
    }
    .search-input {
      flex: 1;
      min-width: 0;
      padding: 10px 18px 10px 44px;
      border: 1.5px solid var(--rule);
      border-radius: 2px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      background: var(--parchment);
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      letter-spacing: 0.5px;
    }
    .search-input::placeholder { color: var(--ink-ghost); font-style: italic; }
    .search-input:focus { border-color: var(--gold); background: var(--cream); }

    .filters-outer {
      position: relative;
      padding: 0 24px 14px;
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      flex-wrap: nowrap;
    }
    .filters::-webkit-scrollbar { display: none; }

    .filters-toggle {
      display: none;
    }

    .filter-btn {
      flex-shrink: 0;
      padding: 5px 15px;
      border: 1px solid var(--rule);
      border-radius: 1px;
      background: transparent;
      font-family: inherit;
      font-size: 0.78rem;
      color: var(--ink-soft);
      cursor: pointer;
      transition: all 0.18s;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .filter-btn:hover { border-color: var(--gold); color: var(--gold); }
    .filter-btn.active {
      background: var(--gold);
      border-color: var(--gold);
      color: #FFF8E8;
      font-weight: 600;
    }

    /* ── RESULTS INFO ── */
    .results-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 18px 28px 10px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .results-bar::before, .results-bar::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--rule);
    }
    .results-count {
      font-size: 0.72rem;
      color: var(--ink-ghost);
      letter-spacing: 2px;
      white-space: nowrap;
      font-style: italic;
    }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1px;
      padding: 0 24px 60px;
      max-width: 1400px;
      margin: 0 auto;
      background: var(--rule);
      border: 1px solid var(--rule);
    }

    /* ── MENU ITEM CARD ── */
    .card {
      background: var(--cream);
      padding: 24px 26px 20px;
      position: relative;
      transition: background 0.2s;
    }
    .card:hover { background: #FFFEF8; }
    .card:hover .card-name { color: var(--gold); }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-num {
      font-family: 'Playfair Display', serif;
      font-size: 0.72rem;
      color: var(--ink-ghost);
      letter-spacing: 1px;
    }
    .card-tag {
      font-size: 0.65rem;
      letter-spacing: 1.5px;
      padding: 2px 10px;
      border: 1px solid currentColor;
      border-radius: 0;
    }

    .card-name {
      font-family: 'Playfair Display', 'Noto Serif SC', serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
      margin-bottom: 10px;
      transition: color 0.2s;
      letter-spacing: 1px;
    }

    .card-rule {
      width: 32px;
      height: 1px;
      background: var(--gold-light);
      margin-bottom: 10px;
    }

    .card-dishes {
      font-size: 0.82rem;
      color: var(--ink-soft);
      font-style: italic;
      line-height: 1.7;
      margin-bottom: 14px;
      letter-spacing: 0.3px;
    }
    .card-dishes .dish-dot {
      color: var(--gold);
      margin: 0 5px;
      font-style: normal;
    }

    .card-address {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--ink-ghost);
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .card-address:hover { color: var(--gold); }
    .card-address:hover span { text-decoration: underline; text-underline-offset: 3px; }
    .card-address-icon {
      flex-shrink: 0;
      margin-top: 1px;
      color: var(--gold);
      opacity: 0.7;
    }

    /* tag category colors */
    .tag-soup      { color: #9B2020; }
    .tag-noodle    { color: #8B6000; }
    .tag-bun       { color: #1A6040; }
    .tag-bbq       { color: #A03010; }
    .tag-braised   { color: #5C2D8A; }
    .tag-meal      { color: #1A3A6A; }
    .tag-snack     { color: #8A1A50; }
    .tag-sweet     { color: #0A6070; }
    .tag-breakfast { color: #3A5A10; }
    .tag-hotpot    { color: #8A1A1A; }

    /* ── NO RESULTS ── */
    .no-results {
      grid-column: 1 / -1;
      background: var(--cream);
      text-align: center;
      padding: 80px 20px;
    }
    .no-results-glyph {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: var(--gold-light);
      margin-bottom: 16px;
    }
    .no-results p {
      color: var(--ink-ghost);
      font-style: italic;
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    /* ── BACK TO TOP ── */
    .back-to-top {
      position: fixed;
      bottom: 28px;
      right: 20px;
      width: 44px;
      height: 44px;
      background: rgba(30, 18, 10, 0.72);
      border: 1px solid rgba(184, 134, 11, 0.45);
      border-radius: 2px;
      color: var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.28s ease, transform 0.28s ease;
      pointer-events: none;
      z-index: 200;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .back-to-top:hover {
      background: rgba(30, 18, 10, 0.92);
      border-color: var(--gold);
    }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 32px 24px;
      font-size: 0.72rem;
      color: var(--ink-ghost);
      letter-spacing: 2px;
      font-style: italic;
      border-top: 1px solid var(--rule);
    }

    /* ── SETTINGS BUTTON ── */
    .btn-settings {
      flex-shrink: 0;
      position: relative;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--rule);
      background: transparent;
      color: var(--ink-ghost);
      cursor: pointer;
      border-radius: 2px;
      transition: border-color 0.2s, color 0.2s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-settings:hover { border-color: var(--gold); color: var(--gold); }
    .btn-settings.connected { border-color: #4caf50; color: #4caf50; }
    .btn-settings.connected::after {
      content: '';
      position: absolute;
      top: -4px; right: -4px;
      width: 8px; height: 8px;
      background: #4caf50;
      border-radius: 50%;
      border: 2px solid var(--cream);
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 84px; right: 20px;
      padding: 9px 15px;
      font-size: 0.78rem;
      letter-spacing: 0.5px;
      z-index: 300;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.syncing { background: rgba(30,18,10,0.85); color: var(--gold-light); }
    .toast.success { background: rgba(20,60,20,0.88); color: #a5d6a7; }
    .toast.error   { background: rgba(160,30,20,0.92); color: #ffcdd2; pointer-events: auto; cursor: pointer; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast.syncing .spin { animation: spin 0.9s linear infinite; display: inline-block; }

    /* ── FORM HINT LINK ── */
    .form-hint a { color: var(--gold); }

    /* ── DISCONNECT BUTTON ── */
    .btn-disconnect {
      display: block;
      width: 100%;
      margin-top: 16px;
      padding: 8px;
      border: 1px solid rgba(192,57,43,0.35);
      background: transparent;
      color: #c0392b;
      font-family: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 1px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, border-color 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-disconnect:hover { background: rgba(192,57,43,0.08); border-color: #c0392b; }

    /* ── ADD BUTTON ── */
    .btn-add {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
      border: 1.5px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-add:hover { background: var(--gold); color: var(--cream); }

    /* ── CARD ACTION BUTTONS ── */
    .card-edit, .card-delete {
      position: absolute;
      width: 24px;
      height: 24px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink-ghost);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      border-radius: 2px;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s, color 0.2s, border-color 0.2s;
    }
    .card-delete { top: 10px; right: 12px; }
    .card-edit   { top: 10px; left:  12px; }
    .card:hover .card-edit,
    .card:hover .card-delete { opacity: 1; }
    .card-edit:hover   { background: rgba(184,134,11,0.12); color: var(--gold);   border-color: rgba(184,134,11,0.4); }
    .card-delete:hover { background: rgba(192,57,43,0.12);  color: #c0392b; border-color: rgba(192,57,43,0.4); }

    /* ── CONFIRM DIALOG ── */
    .confirm-dialog {
      background: var(--cream);
      border: 1px solid var(--rule);
      border-top: 3px solid #c0392b;
      padding: 28px 24px 22px;
      width: min(300px, calc(100vw - 40px));
      text-align: center;
      transform: translateY(14px);
      transition: transform 0.25s ease;
    }
    .modal-overlay.open .confirm-dialog { transform: translateY(0); }
    .confirm-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 3px;
      color: #c0392b;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .confirm-name {
      font-family: 'Playfair Display', 'Noto Serif SC', serif;
      font-size: 1rem;
      color: var(--ink);
      margin-bottom: 6px;
    }
    .confirm-sub {
      font-size: 0.72rem;
      color: var(--ink-ghost);
      font-style: italic;
      margin-bottom: 22px;
    }
    .confirm-actions { display: flex; gap: 10px; }
    .btn-danger {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid #c0392b;
      background: #c0392b;
      color: white;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 1px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }
    .btn-danger:hover { background: #a93226; border-color: #a93226; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(30, 18, 10, 0.65);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--cream);
      border: 1px solid var(--rule);
      border-top: 3px solid var(--gold);
      padding: 32px 28px 28px;
      width: min(460px, 100%);
      max-height: calc(100svh - 40px);
      overflow-y: auto;
      position: relative;
      transform: translateY(14px);
      transition: transform 0.25s ease;
    }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      color: var(--ink);
      margin-bottom: 24px;
      text-align: center;
      letter-spacing: 2px;
    }
    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--ink-ghost);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 2px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: color 0.2s, background 0.2s;
    }
    .modal-close:hover { color: var(--ink); background: var(--parchment); }
    .form-row { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      border: 1.5px solid var(--rule);
      background: var(--parchment);
      color: var(--ink);
      font-family: inherit;
      font-size: 0.9rem;
      padding: 9px 12px;
      outline: none;
      border-radius: 1px;
      transition: border-color 0.2s;
    }
    .form-input:focus, .form-select:focus { border-color: var(--gold); }
    .form-input::placeholder { color: var(--ink-ghost); font-style: italic; }
    .form-hint { font-size: 0.7rem; color: var(--ink-ghost); margin-top: 5px; font-style: italic; }
    .modal-actions { display: flex; gap: 10px; margin-top: 26px; }
    .btn-cancel {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--rule);
      background: transparent;
      color: var(--ink-soft);
      font-family: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 1px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-cancel:hover { border-color: var(--ink-soft); color: var(--ink); }
    .btn-submit {
      flex: 2;
      padding: 10px;
      border: 1.5px solid var(--gold);
      background: var(--gold);
      color: #FFF8E8;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 1px;
      border-radius: 1px;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-submit:hover { background: var(--ink); border-color: var(--ink); }

    @media (max-width: 640px) {
      header h1 { letter-spacing: 3px; }
      .grid { padding: 0 0 48px; }
      .card { padding: 20px 18px 16px; }

      .filters {
        overflow: hidden;
        max-height: 36px;
        transition: max-height 0.4s ease;
      }
      .filters.expanded {
        flex-wrap: wrap;
        max-height: 200px;
      }

      .filters-toggle {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 4px 0 0;
        border: none;
        background: transparent;
        cursor: pointer;
        color: var(--gold);
        outline: none;
        -webkit-tap-highlight-color: transparent;
      }
      .filters-toggle svg {
        transition: transform 0.28s ease;
      }
      .filters-toggle.expanded svg { transform: rotate(180deg); }
    }
  </style>
</head>
<body>

<header>
  <div class="header-ornament">精选推荐</div>
  <h1>開封美食地圖</h1>
  <div class="header-divider"><span>✦</span></div>
  <p>开封 &ensp;·&ensp; 百家老字号 &ensp;·&ensp; 精选</p>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg class="search-icon" width="15" height="15" fill="currentColor" viewBox="0 0 16 16">
      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.415l-3.85-3.85a1 1 0 0 0-.115-.099zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
    </svg>
    <input type="text" class="search-input" id="searchInput" placeholder="搜索店名、菜品、地址…">
    <button class="btn-add" id="openAddModal">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 12 12">
        <line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/>
      </svg>
      添加
    </button>
    <button class="btn-settings" id="openSettings" title="配置 GitHub 同步" aria-label="设置">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="3"/>
        <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>
  <div class="filters-outer">
    <div class="filters" id="filterBtns">
      <button class="filter-btn active" data-cat="全部">全部</button>

<script>
// ── Pinyin (lazy-loaded, optional) ──
let pinyinLib = null;
import('https://esm.sh/pinyin-pro@3').then(m => { pinyinLib = m; }).catch(() => {});

// ── Base64 helpers for GitHub API ──
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function fromBase64(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const buf = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(buf);
}

// ── GitHub config ──
function getGitHubConfig() {
  const token = localStorage.getItem('foodmap_gh_token');
  const full  = localStorage.getItem('foodmap_gh_repo'); // "owner/repo"
  if (!token || !full || !full.includes('/')) return null;
  const slash = full.indexOf('/');
  return { token, owner: full.slice(0, slash), repo: full.slice(slash + 1) };
}

// ── Toast ──
let toastTimer = null;
function showToast(type, msg) {
  const el = document.getElementById('toast');
  clearTimeout(toastTimer);
  const icons = {
    syncing: '<span class="spin">⟳</span>',
    success: '✓',
    error:   '✕ ' + msg + ' &ensp;(点击重试)',
  };
  el.innerHTML = (type !== 'error' ? icons[type] + ' ' + msg : icons[type]);
  el.className = `toast ${type} show`;
  if (type === 'success') toastTimer = setTimeout(() => { el.className = 'toast'; }, 2800);
  if (type === 'error') el.onclick = () => syncToGitHub();
}
function hideToast() { document.getElementById('toast').className = 'toast'; }

// ── GitHub sync ──
let ghSha = null;

async function syncToGitHub() {
  const cfg = getGitHubConfig();
  if (!cfg) { localStorage.setItem('foodmap_data', JSON.stringify(allData)); return; }

  showToast('syncing', '正在同步到 GitHub…');
  try {
    // GET current SHA (also verifies token)
    const getRes = await fetch(
      `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`,
      { headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' } }
    );
    if (!getRes.ok) throw new Error(`${getRes.status}`);
    const file = await getRes.json();
    ghSha = file.sha;

    // PUT updated content
    const putRes = await fetch(
      `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`,
      {
        method: 'PUT',
        headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: '更新餐厅数据', content: toBase64(JSON.stringify(allData, null, 2)), sha: ghSha })
      }
    );
    if (!putRes.ok) throw new Error(`${putRes.status}`);
    const updated = await putRes.json();
    ghSha = updated.content.sha;
    localStorage.setItem('foodmap_data', JSON.stringify(allData));
    showToast('success', '已同步 · 约1分钟后页面更新');
  } catch(e) {
    ghSha = null;
    localStorage.setItem('foodmap_data', JSON.stringify(allData));
    showToast('error', `同步失败 (${e.message})`);
  }
}

// ── TAG_CONFIG ──
const TAG_CONFIG = {
  '早餐类':    ['tag-breakfast', '早 餐'],
  '烧烤类':    ['tag-bbq',       '烧 烤'],
  '火锅麻辣烫':['tag-hotpot',    '火 锅'],
  '炒菜类':    ['tag-meal',      '炒 菜'],
  '汤羹类':    ['tag-soup',      '汤 羹'],
  '面食类':    ['tag-noodle',    '面 食'],
  '包饺类':    ['tag-bun',       '包 饺'],
  '小吃类':    ['tag-snack',     '小 吃'],
  '卤味类':    ['tag-braised',   '卤 味'],
  '甜品饮品':  ['tag-sweet',     '甜 品'],
};

let allData    = [];
let currentCat = '全部';
let currentQ   = '';
let editingId  = null;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function doSearch(q) {
  if (!q.trim()) return allData;
  const lq = q.trim().toLowerCase();
  return allData.filter(r => {
    const textMatch = [r.name, ...r.dishes, r.address, r.category].some(s => s.toLowerCase().includes(lq));
    const pinyinMatch = (r._pinyin || '').includes(lq) || (r._initials || '').includes(lq);
    return textMatch || pinyinMatch;
  });
}

function render() {
  let results = doSearch(currentQ);
  if (currentCat !== '全部') results = results.filter(r => r.category === currentCat);
  document.getElementById('resultsCount').textContent = `共 ${results.length} 家餐厅`;
  const grid = document.getElementById('grid');
  if (results.length === 0) {
    grid.innerHTML = `<div class="no-results"><div class="no-results-glyph">∅</div><p>未找到匹配的餐厅，请换个关键词</p></div>`;
    return;
  }
  const canEdit = !!getGitHubConfig();
  grid.innerHTML = results.map((r, idx) => {
    const [tagCls, tagLabel] = TAG_CONFIG[r.category] || ['', r.category];
    const dishesHtml = r.dishes.map((d, i) => i < r.dishes.length - 1 ? `${escapeHtml(d)}<span class="dish-dot">·</span>` : escapeHtml(d)).join('');
    const numStr = String(idx + 1).padStart(2, '0');
    const actionBtns = canEdit ? `
      <button class="card-delete" data-id="${r.id}" aria-label="删除">
        <svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 10 10">
          <line x1="1" y1="1" x2="9" y2="9"/><line x1="9" y1="1" x2="1" y2="9"/>
        </svg>
      </button>
      <button class="card-edit" data-id="${r.id}" aria-label="编辑">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 12 12">
          <path d="M8.5 1.5L10.5 3.5L4 10H2V8L8.5 1.5Z"/>
        </svg>
      </button>` : '';
    return `<div class="card">
      ${actionBtns}
      <div class="card-meta">
        <span class="card-num">No.${numStr}</span>
        <span class="card-tag ${tagCls}">${escapeHtml(tagLabel)}</span>
      </div>
      <div class="card-name">${escapeHtml(r.name)}</div>
      <div class="card-rule"></div>
      <div class="card-dishes">${dishesHtml}</div>
      <a class="card-address" href="https://uri.amap.com/search?keyword=${encodeURIComponent(r.mapKeyword || r.name)}&city=开封&src=foodmap&callnative=1" target="_blank" rel="noopener" title="在高德地图中查看">
        <svg class="card-address-icon" width="11" height="14" fill="currentColor" viewBox="0 0 12 16">
          <path d="M6 0C3.24 0 1 2.24 1 5c0 3.75 5 11 5 11s5-7.25 5-11c0-2.76-2.24-5-5-5zm0 7.5C4.62 7.5 3.5 6.38 3.5 5S4.62 2.5 6 2.5 8.5 3.62 8.5 5 7.38 7.5 6 7.5z"/>
        </svg>
        <span>${escapeHtml(r.address)}</span>
      </a>
    </div>`;
  }).join('');
}

// ── Search & filter ──
document.getElementById('searchInput').addEventListener('input', e => { currentQ = e.target.value; render(); });
document.getElementById('filtersToggle').addEventListener('click', () => {
  const fb = document.getElementById('filterBtns'), tg = document.getElementById('filtersToggle');
  const exp = fb.classList.toggle('expanded');
  tg.classList.toggle('expanded', exp);
  tg.setAttribute('aria-expanded', exp);
});
document.getElementById('filterBtns').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  currentCat = btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
});

// ── Back to top ──
const backToTop = document.getElementById('backToTop');
window.addEventListener('scroll', () => { backToTop.classList.toggle('visible', window.scrollY > 300); }, { passive: true });
backToTop.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });

// ── Confirm dialog ──
let confirmResolve = null;
function showConfirm(name) {
  return new Promise(resolve => {
    confirmResolve = resolve;
    document.getElementById('confirmName').textContent = `「${name}」`;
    document.getElementById('confirmOverlay').classList.add('open');
  });
}
function resolveConfirm(yes) {
  document.getElementById('confirmOverlay').classList.remove('open');
  if (confirmResolve) { confirmResolve(yes); confirmResolve = null; }
}
document.getElementById('confirmOk').addEventListener('click',     () => resolveConfirm(true));
document.getElementById('confirmCancel').addEventListener('click', () => resolveConfirm(false));
document.getElementById('confirmOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('confirmOverlay')) resolveConfirm(false);
});

// ── Card actions (edit / delete) ──
document.getElementById('grid').addEventListener('click', async e => {
  const editBtn = e.target.closest('.card-edit');
  if (editBtn) {
    const entry = allData.find(r => r.id === Number(editBtn.dataset.id));
    if (!entry) return;
    editingId = entry.id;
    document.getElementById('f-name').value     = entry.name;
    document.getElementById('f-dishes').value   = entry.dishes.join('，');
    document.getElementById('f-address').value  = entry.address;
    document.getElementById('f-category').value = entry.category;
    document.getElementById('modalTitle').textContent          = '编 辑 餐 厅';
    document.querySelector('#addForm .btn-submit').textContent = '保存修改';
    openModal();
    return;
  }
  const delBtn = e.target.closest('.card-delete');
  if (!delBtn) return;
  const delId = Number(delBtn.dataset.id);
  const entry = allData.find(r => r.id === delId);
  if (!await showConfirm(entry?.name || '')) return;
  allData = allData.filter(r => r.id !== delId);
  render();
  syncToGitHub();
});

// ── Add modal ──
const overlay = document.getElementById('modalOverlay');
const addForm = document.getElementById('addForm');
function openModal()  { overlay.classList.add('open'); document.getElementById('f-name').focus(); }
function closeModal() {
  overlay.classList.remove('open');
  addForm.reset();
  if (editingId !== null) {
    editingId = null;
    document.getElementById('modalTitle').textContent          = '添 加 餐 厅';
    document.querySelector('#addForm .btn-submit').textContent = '添加餐厅';
  }
}
document.getElementById('openAddModal').addEventListener('click', openModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('cancelAdd').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });

addForm.addEventListener('submit', e => {
  e.preventDefault();
  const name      = document.getElementById('f-name').value.trim();
  const dishesRaw = document.getElementById('f-dishes').value.trim();
  const address   = document.getElementById('f-address').value.trim();
  const category  = document.getElementById('f-category').value;
  if (!name || !dishesRaw || !address || !category) return;
  const dishes    = dishesRaw.split(/[，,、；;]/).map(s => s.trim()).filter(Boolean);
  const origEntry = editingId !== null ? allData.find(r => r.id === editingId) : null;
  const allText   = [name, ...dishes, address].join('');
  const _pinyin   = pinyinLib ? pinyinLib.pinyin(allText, { toneType: 'none', separator: ' ' })                    : (origEntry?._pinyin   || '');
  const _initials = pinyinLib ? pinyinLib.pinyin(allText, { pattern: 'first', toneType: 'none', separator: '' }) : (origEntry?._initials || '');
  if (editingId !== null) {
    const idx = allData.findIndex(r => r.id === editingId);
    if (idx >= 0) allData[idx] = { ...allData[idx], name, dishes, address, category, _pinyin, _initials };
    render();
    closeModal();
    syncToGitHub();
  } else {
    const newId = allData.reduce((m, r) => Math.max(m, r.id), 0) + 1;
    allData.push({ id: newId, name, dishes, address, category, _pinyin, _initials });
    currentCat = '全部';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === '全部'));
    render();
    closeModal();
    syncToGitHub();
    requestAnimationFrame(() => {
      const card = document.querySelector(`[data-id="${newId}"]`)?.closest('.card');
      if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }
});

// ── Settings modal ──
const settingsOverlay = document.getElementById('settingsOverlay');
function openSettings() {
  document.getElementById('s-repo').value  = localStorage.getItem('foodmap_gh_repo')  || '';
  document.getElementById('s-token').value = localStorage.getItem('foodmap_gh_token') || '';
  const connected = !!getGitHubConfig();
  document.getElementById('settingsDisconnect').style.display = connected ? '' : 'none';
  settingsOverlay.classList.add('open');
}
function closeSettings() { settingsOverlay.classList.remove('open'); }

document.getElementById('openSettings').addEventListener('click', openSettings);
document.getElementById('settingsClose').addEventListener('click', closeSettings);
document.getElementById('settingsCancel').addEventListener('click', closeSettings);
settingsOverlay.addEventListener('click', e => { if (e.target === settingsOverlay) closeSettings(); });

document.getElementById('settingsSave').addEventListener('click', () => {
  const repo  = document.getElementById('s-repo').value.trim();
  const token = document.getElementById('s-token').value.trim();
  if (!repo || !repo.includes('/') || !token) { alert('请填写完整的仓库名和 Token'); return; }
  localStorage.setItem('foodmap_gh_repo',  repo);
  localStorage.setItem('foodmap_gh_token', token);
  updateSettingsBtn();
  closeSettings();
  syncToGitHub(); // first sync to verify + push current state
});

document.getElementById('settingsDisconnect').addEventListener('click', () => {
  if (!confirm('断开 GitHub 同步？已有的本地数据不会丢失。')) return;
  localStorage.removeItem('foodmap_gh_token');
  localStorage.removeItem('foodmap_gh_repo');
  updateSettingsBtn();
  closeSettings();
  hideToast();
});

function updateSettingsBtn() {
  const connected = !!getGitHubConfig();
  document.getElementById('openSettings').classList.toggle('connected', connected);
  document.getElementById('openAddModal').style.display = connected ? '' : 'none';
  // re-render so card action buttons appear/disappear
  if (allData.length) render();
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeSettings(); resolveConfirm(false); } });

// ── Load data ──
async function loadData() {
  const cfg = getGitHubConfig();

  if (cfg) {
    // GitHub mode: always fetch fresh from API, fall back to cache only on error
    try {
      const res = await fetch(
        `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/data.json`,
        { headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json' } }
      );
      if (!res.ok) throw new Error(res.status);
      const file = await res.json();
      ghSha   = file.sha;
      allData = JSON.parse(fromBase64(file.content));
      localStorage.setItem('foodmap_data', JSON.stringify(allData));
      render();
      updateSettingsBtn();
      return;
    } catch {}

    // API failed — use local cache as fallback
    try {
      const cached = JSON.parse(localStorage.getItem('foodmap_data'));
      if (Array.isArray(cached) && cached.length) { allData = cached; render(); }
    } catch {}

  } else {
    // No GitHub config: always fetch the static file fresh (bypass browser cache)
    // localStorage is NOT used as primary — it may be stale from a previous visit
    try {
      const res = await fetch(`data.json?t=${Date.now()}`, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const base = await res.json();

      // Migrate old-style localStorage additions/deletions if present
      const oldDel = new Set(JSON.parse(localStorage.getItem('foodmap_deleted') || '[]'));
      const oldAdd = JSON.parse(localStorage.getItem('foodmap_added') || '[]');
      allData = [...base.filter(r => !oldDel.has(r.id)), ...oldAdd];
      render();
    } catch {
      // Network unavailable — try local cache as last resort
      try {
        const cached = JSON.parse(localStorage.getItem('foodmap_data'));
        if (Array.isArray(cached) && cached.length) { allData = cached; render(); return; }
      } catch {}
      document.getElementById('grid').innerHTML = `<div class="no-results"><div class="no-results-glyph">!</div><p>无法加载数据，请通过 Live Server 打开此页面</p></div>`;
    }
  }

  updateSettingsBtn();
}

loadData();
</script>
</body>
</html>
